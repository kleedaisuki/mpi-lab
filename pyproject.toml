[build-system]
requires = [
    "cmake>=3.29",
    "ninja>=1.11",
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "mpi-svd-lab"
version = "0.1.0"
description = "MPI SVD lab project scaffold."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.13",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.scripts]
bench = "bench.main:main"

[project.optional-dependencies]
analysis = [
    "joblib>=1.4",
    "numba>=0.60",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]
data = [
    "h5py>=3.11",
    "pyarrow>=16.0",
    "tables>=3.9",
    "zarr>=2.18",
]
dev = [
    "build>=1.2",
    "cmake>=3.29",
    "mypy>=1.10",
    "ninja>=1.11",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
]
hpc = [
    "dask[distributed]>=2024.5",
    "mpi4py>=3.1",
]
notebook = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
]
plot = [
    "matplotlib>=3.9",
    "plotly>=5.22",
    "seaborn>=0.13",
]
all = [
    "build>=1.2",
    "cmake>=3.29",
    "dask[distributed]>=2024.5",
    "h5py>=3.11",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "joblib>=1.4",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "mpi4py>=3.1",
    "mypy>=1.10",
    "ninja>=1.11",
    "numba>=0.60",
    "numpy>=1.26",
    "plotly>=5.22",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tables>=3.9",
    "zarr>=2.18",
]

[tool.scikit-build]
build-dir = "build/python"
cmake.build-type = "Release"
cmake.args = [
    "-DMPILAB_BUILD_TESTS=OFF",
]
wheel.packages = ["src/bench"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PL",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "PLR0913",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_configs = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "benchmark: performance and benchmarking tests",
    "mpi: tests that require an MPI launcher or MPI runtime",
    "slow: long-running experiment or integration tests",
]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/**/*.cpp",
    "src/**/*.hpp",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
